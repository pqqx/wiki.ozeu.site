おぜうの集いとは、主にDiscordサーバーへ荒らしを行っている荒らしサーバーの名称である。おぜうの集いは別名におぜう、ACVR、荒らし枢軸軍や、蔑称におぜいといった名前がある。

## 幹部及びメンバーについて
### おぜう
おぜうの集いの最高指導者であり、おぜうの集いの創設者。性別は男。気の乗り替わりが早い。作ったプロジェクトは気が向かなくなると放置する。人集めには唯一無二。人脈には非常に富んでおり、金もそれなりに所持している。横揺れ動画を投稿するなど、流行りには乗りやすい。主な使用機種はMacbookが確認される。スマホの機種は不明。本名と顔は特定済みのようであるが、本当かどうかはわからない。志望高校はFランではないため学力もあると言える。基本的に人を雑に扱うのが当たり前である。
### ぜっとぷらす
おぜうの集いの絵文字やスタンプ、LINEスタンプ、バナーやロゴなど、様々なシーンで絵描きをしている。顔は自ら公開済み。名前は不明。下ネタが好きでたびたび卑猥な言葉を喋っている。成人済み。深く考えて決めることには拒絶する。基本昔某携帯ショップを転々として働いていた。最近はラブホテルで働いている。
### くらいどる
おぜうの集いの古参メンバーに部類される。これまでに数々のおぜうの集いの荒らしBot(Explosion、WebTool)などを作成してきた。なお、当の本人はこの仕事にあまり興味がないらしく、ところどころAIの使用の痕跡がある。常に自分の意志を損なわないため客観的な指摘をすることが得意。過去におぜうとぜとぷらの介護をしたことがある。ああぼっとのオーナーのベッドロック作成者である「たか」とは同一人物であるという証拠が数多く存在する。
### むめー
過去によくDiscord外の荒らし部門として活動していた。[Stoat(Discordの類似コミュニティ)](https://stoat.chat)を荒らしたり、個人ブログで連続投稿を行うなど、主にDiscord外での荒らしに注力していた。尖閣や幹脱など、不正乗車のプロフェッショナルである。改札に関してやけに詳しい。性別は男。本人情報より恵比寿住みと公開されている。現在は高校1年生。過去にらいとせーばーに顔、pxho(すーちゃん)により名字が公開されている。
### らいとせーばー
